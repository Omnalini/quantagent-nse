<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Advisory System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <h1>📈 Stock Advisory System</h1>

        <div class="input-box">
            <label>Select Stock</label>
            <select id="stock">
                <option value="RELIANCE">RELIANCE</option>
                <option value="TCS">TCS</option>
                <option value="INFY">INFY</option>
                <option value="HDFCBANK">HDFCBANK</option>
                <option value="ICICIBANK">ICICIBANK</option>
                <option value="SBIN">SBIN</option>
                <option value="ITC">ITC</option>
                <option value="LT">LT</option>
                <option value="HINDUNILVR">HINDUNILVR</option>
                <option value="BAJFINANCE">BAJFINANCE</option>
            </select>

            <button onclick="analyzeStock()">Analyze</button>
        </div>

        <div id="loading" class="hidden">Analyzing...</div>

        <div id="result" class="hidden">
            <div class="section">
                <h3>Final Decision</h3>
                <div id="decision" class="decision-box"></div>
                <p id="reason"></p>
            </div>
        
            <div class="section">
                <h3>Indicators</h3>
                <pre id="indicators"></pre>
            </div>
        
            <div class="section">
                <h3>Trend</h3>
                <pre id="trend"></pre>
            </div>
        
            <div class="section">
                <h3>Pattern</h3>
                <pre id="pattern"></pre>
            </div>
        
            <div class="section">
                <h3>Risk Management</h3>
                <pre id="risk"></pre>
            </div>
        </div>        
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
